[package]
name = "etol"
version = "0.3.3"
edition = "2021"
rust-version = "1.80"
description = "ETOL · Easy Telemetry On Linux: detector, configurador y lanzador de la pila de telemetria para simuladores"
license = "MIT"

[[bin]]
name = "etol"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
