[package]
name = "etol-gui"
version = "0.3.1"
edition = "2021"
rust-version = "1.77"
description = "ETOL · Easy Telemetry On Linux: panel grafico"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
etol = { path = ".." }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
