[package]
name = "etol-gui"
version = "0.3.18"
edition = "2021"
rust-version = "1.80"
description = "ETOL · Easy Telemetry On Linux: panel grafico"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
etol = { path = ".." }
ksni = { version = "0.3.7", features = ["blocking"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
