<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimHub Linux — Dash Studio</title>
<style>
  @font-face {
    font-family: 'RussellSquare';
    src: url('/api/fonts/RussellSquare.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Cousine';
    src: url('/api/fonts/Cousine-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
  }
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: top left;
    overflow: hidden;
    background: #000;
  }
  .item {
    position: absolute;
    box-sizing: border-box;
    overflow: hidden;
  }
  .item.hidden {
    display: none !important;
  }
  #hud {
    position: fixed;
    left: 10px;
    top: 10px;
    z-index: 1000;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 6px 8px;
    border-radius: 8px;
    background: rgba(10, 10, 12, .78);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 4px 18px rgba(0,0,0,.45);
    backdrop-filter: blur(6px);
    font-size: 12px;
  }
  #hud.hidden { display: none; }
  #hud select {
    max-width: 42vw;
    background: #181a1f;
    color: #eee;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 12px;
  }
  #status {
    position: fixed;
    left: 10px;
    bottom: 10px;
    z-index: 1000;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(10,10,12,.72);
    border: 1px solid rgba(255,255,255,.12);
    color: #9fe3b0;
    font-size: 11px;
    letter-spacing: .02em;
  }
  #hint {
    color: #8a8f98;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div id="stage"></div>

  <div id="hud">
    <strong style="color:#fff;font-weight:600">Dash</strong>
    <select id="dashSelect"></select>
    <span id="hint">H oculta</span>
  </div>

  <div id="status">iniciando…</div>

  <script src="/djson.js"></script>
</body>
</html>
